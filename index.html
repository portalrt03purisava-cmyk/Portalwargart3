<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6b4f">
<title>Portal Warga RT 03 Puri Sava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10241d; --muted:#4f645b; --bg:#f2f5f3; --card:#fff; --line:#d3dcd6;
  --green:#0b6b4f; --green-d:#084c38; --green-s:#dcefe6;
  --warn:#8a4b00; --warn-s:#fdebc8; --warn-b:#e09a1f;
  --bad:#a8271f; --bad-s:#fbe1de;
  --neutral-s:#e7ece9;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:26px;line-height:1.2;font-weight:800;margin:20px 0 14px}
h2{font-size:19px;line-height:1.3;font-weight:700;margin:26px 0 10px}
h3{font-size:17px;margin:0;font-weight:700}
p{margin:0 0 8px}
a{color:var(--green-d)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.main{padding-bottom:110px;min-height:70vh}

/* Kepala halaman: plakat RT seperti papan nomor di gerbang */
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.plakat{display:inline-flex;align-items:baseline;gap:10px;background:#fff;border:3px solid var(--green);border-radius:10px;padding:3px 14px 4px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px var(--green)}
.plakat b{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--green-d)}
.plakat span{font-size:14px;font-weight:600;color:var(--green-d)}
.plakat.besar{padding:6px 22px 8px}
.plakat.besar b{font-size:44px}
.plakat.besar span{font-size:19px}
.siapa{text-align:right;font-size:14px;line-height:1.3;color:var(--muted)}
.siapa strong{display:block;color:var(--ink);font-size:15px}
.preview{background:var(--warn-s);color:var(--warn);text-align:center;font-size:14px;font-weight:600;padding:6px 10px}

/* Tombol & isian */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.kecil{min-height:40px;padding:0 14px;font-size:15px}
.btn.lebar{width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.btn.tautan{border:0;background:none;color:var(--green-d);text-decoration:underline;min-height:44px;padding:0 6px}
:focus-visible{outline:3px solid #7cc4a8;outline-offset:2px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field small{display:block;color:var(--muted);margin-top:5px;font-size:14px;line-height:1.4}
input,select,textarea{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid #9fb1a8;border-radius:10px;background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
.kode{font-size:30px;font-weight:800;letter-spacing:10px;text-align:center}
.err{color:var(--bad);font-weight:600;margin:4px 0 12px;min-height:0}
.err:empty{display:none}
.jebakan{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.aksi{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.aksi .btn{flex:1 1 140px}

/* Kartu & daftar */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.daftar{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
button.item{cursor:pointer}
button.item:hover{background:#f7faf8}
.item .isi{min-width:0;flex:1}
.item .judul{font-weight:700;overflow-wrap:anywhere}
.item .ket{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.item .kanan{text-align:right;flex:none}
.blok{padding:14px 16px;border-bottom:1px solid var(--line)}
.blok:last-child{border-bottom:0}
.blok p{white-space:pre-wrap;overflow-wrap:anywhere}
.blok .tgl{font-size:14px;color:var(--muted)}
.kosong{color:var(--muted);padding:16px;margin:0}
.muat{color:var(--muted);padding:30px 0;text-align:center}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:700;background:var(--neutral-s);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--green-s);color:var(--green-d)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.angka{font-variant-numeric:tabular-nums;font-weight:700}

/* Kartu status utama */
.status{border-radius:14px;padding:18px 18px 16px;border-left:8px solid var(--green);background:var(--green-s);margin-bottom:6px}
.status.warn{border-color:var(--warn-b);background:var(--warn-s);color:#4a2900}
.status.neutral{border-color:#8a9a92;background:var(--neutral-s)}
.status .kecil{font-size:15px;font-weight:600;margin:0}
.status .besar{font-size:30px;line-height:1.2;font-weight:800;margin:2px 0 6px}
.saldo{background:var(--green-d);color:#fff;border-radius:14px;padding:20px}
.saldo .kecil{font-size:15px;opacity:.85;margin:0}
.saldo .besar{font-size:34px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tiga div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tiga small{display:block;color:var(--muted);font-size:13px}
.tiga strong{font-size:17px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;background:var(--neutral-s);padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--green-d)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:13px;color:var(--muted);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.bagian{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.bagian h2{margin:0}
.kembali{margin:14px 0 0}
.badge{background:var(--bad);color:#fff;border-radius:99px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0 7px}

/* Navigasi bawah */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current=page]{color:var(--green-d)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--green)}

/* Dialog */
.back{position:fixed;inset:0;background:rgba(16,36,29,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 28px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h h2{margin:0}
.x{width:44px;height:44px;border:0;border-radius:99px;background:var(--neutral-s);font-size:26px;line-height:1;cursor:pointer}
.rinci{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0 0 6px}
.rinci dt{color:var(--muted);font-size:15px}
.rinci dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media (min-width:720px){.back{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:30;max-width:92vw;font-weight:600}
.toast.bad{background:var(--bad)}
.hero{text-align:center;padding:34px 0 10px}
.hero p{color:var(--muted);max-width:420px;margin:14px auto 0}
.cari{margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:naik .18s ease-out}@keyframes naik{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Portal ini memerlukan JavaScript. Mohon aktifkan JavaScript di browser Anda.</p></noscript>
<div id="app"></div>

<script>
'use strict';
/* ====== Pembantu umum ====== */
const PREVIEW = typeof google === 'undefined' || !google.script;
const S = { token: null, user: null, cfg: {}, tab: 'beranda' };
try { S.token = sessionStorage.getItem('rt03t'); } catch (e) {}

const $ = (s, r) => (r || document).querySelector(s);
// Membuat elemen DOM. Teks selalu dimasukkan sebagai teks (bukan HTML) sehingga aman dari penyisipan script.
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) tambahAnak(el, arguments[i]);
  return el;
}
function tambahAnak(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) c.forEach(x => tambahAnak(el, x));
  else el.append(c.nodeType ? c : document.createTextNode(String(c)));
}
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + BULAN[+m[2] - 1].slice(0, 3) + ' ' + m[1] : (s || ''); };
const per = p => { const m = /^(\d{4})-(\d{2})$/.exec(p || ''); return m ? BULAN[+m[2] - 1] + ' ' + m[1] : (p || ''); };
const hariIni = () => { const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
const bisa = izin => !!(S.user && S.user.izin && S.user.izin.indexOf(izin) >= 0);
const KELAS = { Lunas: 'ok', Aktif: 'ok', 'Akan datang': 'ok', Belum: 'warn', Menunggu: 'warn', Dibatalkan: 'bad', Nonaktif: 'bad', Ditolak: 'bad' };
const pill = t => h('span', { class: 'pill ' + (KELAS[t] || '') }, t);

const IKON = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  iuran: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  kalender: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  kas: '<path d="M3 10l9-6 9 6"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  kembali: '<path d="M15 5l-7 7 7 7"/>',
};
function ikon(nama) { // isi ikon adalah konstanta di atas, bukan data pengguna
  const s = h('span', { 'aria-hidden': 'true', style: 'display:inline-flex' });
  s.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IKON[nama] + '</svg>';
  return s;
}

function toast(t, buruk) {
  const e = h('div', { class: 'toast' + (buruk ? ' bad' : ''), role: 'status' }, t);
  document.body.append(e);
  setTimeout(() => e.remove(), 3800);
}

/* ====== Komunikasi dengan server ====== */
function call(aksi, data) {
  return new Promise((resolve, reject) => {
    const sukses = res => {
      if (res && res.ok) return resolve(res.data);
      const e = new Error((res && res.error) || 'Terjadi kesalahan.');
      if (res && res.sesiHabis) { e.sesiHabis = true; keluarLokal(); viewMasuk(); toast('Sesi berakhir. Silakan masuk lagi.', true); }
      reject(e);
    };
    const gagal = () => reject(new Error('Tidak bisa terhubung. Periksa sinyal internet Anda lalu coba lagi.'));
    if (PREVIEW) return setTimeout(() => { let r; try { r = { ok: true, data: mock(aksi, data || {}) }; } catch (e) { r = { ok: false, error: e.message }; } sukses(r); }, 120);
    google.script.run.withSuccessHandler(sukses).withFailureHandler(gagal).api(aksi, S.token, data || {});
  });
}
function keluarLokal() { S.token = null; S.user = null; try { sessionStorage.removeItem('rt03t'); } catch (e) {} }
async function jalankan(tombol, fn) {
  const t = tombol.textContent; tombol.disabled = true; tombol.textContent = 'Mohon tunggu…';
  try { return await fn(); } catch (e) { if (!e.sesiHabis) toast(e.message, true); } finally { tombol.disabled = false; tombol.textContent = t; }
}

/* ====== Dialog & formulir ====== */
function dialog(judul, isi) {
  const tutup = () => { back.remove(); if (!$('.back')) document.body.classList.remove('lock'); };
  const back = h('div', { class: 'back', onclick: e => { if (e.target === back) tutup(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': judul },
      h('div', { class: 'sheet-h' }, h('h2', null, judul), h('button', { class: 'x', type: 'button', 'aria-label': 'Tutup', onclick: tutup }, '×')), isi));
  document.body.append(back); document.body.classList.add('lock');
  return { tutup };
}
function konfirmasi(teks, label, bahaya) {
  return new Promise(res => {
    const dlg = dialog('Konfirmasi', h('div', null, h('p', null, teks),
      h('div', { class: 'aksi' },
        h('button', { class: 'btn', type: 'button', onclick: () => { dlg.tutup(); res(false); } }, 'Batal'),
        h('button', { class: 'btn ' + (bahaya ? 'danger' : 'primary'), type: 'button', onclick: () => { dlg.tutup(); res(true); } }, label))));
  });
}
// bidang: {nama,label,tipe,opsi,nilai,bantuan,contoh,maks,mode,auto,opsiFn(v),jika(v)}
function buatForm(bidang) {
  const el = h('div'), kontrol = {}, bungkus = {};
  let awal = true;
  bidang.forEach(b => {
    const id = 'f_' + b.nama + Math.random().toString(36).slice(2, 6);
    let c;
    if (b.tipe === 'pilih') { c = h('select', { id }); (b.opsi || []).forEach(o => c.append(h('option', { value: o.v }, o.t))); }
    else if (b.tipe === 'panjang') c = h('textarea', { id, maxlength: b.maks || 1000 });
    else c = h('input', { id, type: b.tipe || 'text', maxlength: b.maks, inputmode: b.mode, autocomplete: b.auto || 'off', placeholder: b.contoh, min: b.min, max: b.max });
    if (b.nilai != null && !b.opsiFn) c.value = b.nilai;
    kontrol[b.nama] = c;
    bungkus[b.nama] = h('div', { class: 'field' }, h('label', { for: id }, b.label), c, b.bantuan ? h('small', null, b.bantuan) : null);
    el.append(bungkus[b.nama]);
  });
  function nilai() { const v = {}; for (const k in kontrol) v[k] = kontrol[k].value; return v; }
  function segarkan() {
    const v = nilai();
    bidang.forEach(b => {
      if (b.opsiFn) {
        const c = kontrol[b.nama], lama = awal && b.nilai != null ? b.nilai : c.value;
        c.replaceChildren(); b.opsiFn(v).forEach(o => c.append(h('option', { value: o.v }, o.t)));
        if (Array.prototype.some.call(c.options, o => o.value === lama)) c.value = lama;
      }
      if (b.jika) bungkus[b.nama].hidden = !b.jika(v);
    });
    awal = false;
  }
  el.addEventListener('input', segarkan); el.addEventListener('change', segarkan);
  segarkan();
  return { el, nilai };
}
function formBox(judul, bidang, label, onSubmit, info) {
  const f = buatForm(bidang), err = h('p', { class: 'err', role: 'alert' });
  const btn = h('button', { class: 'btn primary lebar', type: 'submit' }, label || 'Simpan');
  const form = h('form', { novalidate: true }, info ? h('p', null, info) : null, f.el, err, btn);
  const dlg = dialog(judul, form);
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    const t = btn.textContent; btn.disabled = true; btn.textContent = 'Mohon tunggu…';
    try { await onSubmit(f.nilai()); dlg.tutup(); }
    catch (ex) { if (!ex.sesiHabis) err.textContent = ex.message; }
    finally { btn.disabled = false; btn.textContent = t; }
  });
  return dlg;
}
async function muat(wadah, ambil, render) {
  wadah.replaceChildren(h('p', { class: 'muat' }, 'Memuat…'));
  try { const d = await ambil(); wadah.replaceChildren(); render(d, wadah); }
  catch (e) { if (e.sesiHabis) return; wadah.replaceChildren(h('div', { class: 'card' }, h('p', null, e.message), h('button', { class: 'btn', onclick: () => muat(wadah, ambil, render) }, 'Coba lagi'))); }
}
const opsi = arr => arr.map(x => ({ v: x, t: x }));

/* ====== Tampilan sebelum masuk ====== */
const app = $('#app');
function tampil(node) { app.replaceChildren(node); window.scrollTo(0, 0); }
const plakat = besar => h('div', { class: 'plakat' + (besar ? ' besar' : '') }, h('b', null, 'RT 03'), h('span', null, 'Puri Sava'));
const pitaPreview = () => PREVIEW ? h('div', { class: 'preview' }, 'Mode contoh: data di layar ini tiruan, belum terhubung ke database.') : null;

function viewMasuk() {
  const kotak = h('div', { class: 'card' });
  let hp = '', em = '', hitung = null;
  function langkah1(pesanGalat) {
    clearInterval(hitung);
    const f = buatForm([
      { nama: 'hp', label: 'Nomor HP', tipe: 'tel', mode: 'tel', auto: 'tel', contoh: '0812 3456 7890', nilai: hp, maks: 20 },
      { nama: 'email', label: 'Email', tipe: 'email', auto: 'email', contoh: 'nama@email.com', nilai: em, maks: 120, bantuan: 'Gunakan nomor HP dan email yang didaftarkan ke pengurus RT. Kode masuk dikirim ke email ini.' },
    ]);
    const err = h('p', { class: 'err', role: 'alert' }, pesanGalat || '');
    const btn = h('button', { class: 'btn primary lebar', type: 'submit' }, 'Kirim kode ke email');
    const form = h('form', { novalidate: true }, f.el, err, btn);
    form.addEventListener('submit', e => { e.preventDefault(); err.textContent = ''; jalankanForm(btn, err, async () => {
      const v = f.nilai(); hp = v.hp; em = v.email;
      await call('mintaOtp', { hp, email: em });
      langkah2();
    }); });
    kotak.replaceChildren(h('h2', { style: 'margin-top:0' }, 'Masuk'), form,
      h('hr', { style: 'border:0;border-top:1px solid var(--line);margin:18px 0' }),
      h('p', null, 'Belum terdaftar sebagai warga?'),
      h('button', { class: 'btn lebar', type: 'button', onclick: viewDaftar }, 'Daftar sebagai warga'));
  }
  function langkah2() {
    const f = buatForm([{ nama: 'kode', label: 'Kode 6 angka dari email', tipe: 'text', mode: 'numeric', auto: 'one-time-code', maks: 6, contoh: '••••••' }]);
    f.el.querySelector('input').classList.add('kode');
    const err = h('p', { class: 'err', role: 'alert' });
    const btn = h('button', { class: 'btn primary lebar', type: 'submit' }, 'Masuk');
    const ulang = h('button', { class: 'btn tautan', type: 'button', disabled: true }, 'Kirim ulang kode');
    const form = h('form', { novalidate: true }, f.el, err, btn);
    form.addEventListener('submit', e => { e.preventDefault(); err.textContent = ''; jalankanForm(btn, err, async () => {
      const r = await call('masuk', { hp, email: em, kode: f.nilai().kode });
      S.token = r.token; S.user = r.pengguna;

function subWarga(w) {

async function detailWarga(id) {

function subPendaftar(w) {

function subKelola(w) {

async function boot() {

}
